# Jones et al. (2023) Fig. 1 subregions along the eastern Andes, digitized
# from the figure with WebPlotDigitizer.
#
# Vertices are [longitude, latitude] in degrees east / north, so negative
# throughout this domain. Rings are open -- the loader closes them.
#
# Regions run south (1) to north (5). The type rules reference them by
# number: Central is 1/2/12/23/123, Northern is 4/5/45/34/345,
# Andes is 12345/1234/234/2345, and Peru is 3 alone.
#
# Shared boundaries are SNAPPED: each pair of digitized vertices that should
# have been the same point was replaced by its midpoint, and that value is
# written identically into both neighbouring regions. Original digitized
# values and the gaps they left are recorded at the bottom.

